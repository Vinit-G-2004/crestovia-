<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crestovia — Business Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy-900:#081d3b;
  --navy-800:#0d3574;
  --navy-700:#12459a;
  --navy-100:#e8eef8;
  --orange-600:#e0590a;
  --orange-500:#f5720a;
  --orange-100:#fef0e3;
  --bg:#f4f6fb;
  --surface:#ffffff;
  --text:#182338;
  --muted:#68748c;
  --border:#e3e8f0;
  --success:#1a9c5c;
  --success-bg:#e7f7ee;
  --danger:#d9402a;
  --danger-bg:#fdeceb;
  --radius:10px;
  --font-display:'Sora',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
#app{display:flex;min-height:100vh;}
#app.login-mode{display:block;}
.login-screen{min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-card{max-width:360px;width:100%;padding:34px 30px;}
.login-logo{text-align:center;margin-bottom:22px;}
.login-logo img{width:54px;height:54px;border-radius:12px;margin-bottom:10px;}
.login-logo .lc-name{font-family:var(--font-display);font-weight:700;font-size:19px;}
.login-logo .lc-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.login-error{color:var(--danger);font-size:12.5px;margin-bottom:12px;background:var(--danger-bg);padding:8px 11px;border-radius:7px;display:none;}

/* SIDEBAR */
#sidebar{
  width:236px;
  background:linear-gradient(180deg,var(--navy-900) 0%,var(--navy-800) 100%);
  color:#fff;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  position:sticky;
  top:0;
  height:100vh;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  padding:22px 20px 18px;
  border-bottom:1px solid rgba(255,255,255,0.08);
}
.brand img{width:34px;height:34px;border-radius:8px;background:#fff;padding:3px;}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:0.2px;}
.brand-sub{font-size:10.5px;color:rgba(255,255,255,0.55);letter-spacing:0.6px;text-transform:uppercase;margin-top:1px;}
nav{padding:14px 12px;flex:1;overflow-y:auto;}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:10px 12px;border-radius:8px;
  color:rgba(255,255,255,0.68);
  font-size:13.5px;font-weight:500;
  cursor:pointer;margin-bottom:2px;
  transition:background 0.12s,color 0.12s;
  user-select:none;
}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
.nav-item.active{background:var(--orange-500);color:#fff;}
.nav-item svg{width:17px;height:17px;flex-shrink:0;}
.sidebar-foot{padding:16px 20px;border-top:1px solid rgba(255,255,255,0.08);font-size:11px;color:rgba(255,255,255,0.4);}

/* MAIN */
#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:18px 30px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:20;
}
#topbar h1{font-family:var(--font-display);font-size:20px;font-weight:600;}
#topbar .sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
#content{padding:26px 30px 60px;max-width:1240px;width:100%;}

/* BUTTONS */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:9px 15px;border-radius:8px;border:1px solid var(--border);
  background:#fff;color:var(--text);font-size:13px;font-weight:600;
  cursor:pointer;font-family:var(--font-body);transition:all .12s;
}
.btn:hover{border-color:var(--navy-700);}
.btn svg{width:15px;height:15px;}
.btn-primary{background:var(--orange-500);border-color:var(--orange-500);color:#fff;}
.btn-primary:hover{background:var(--orange-600);border-color:var(--orange-600);}
.btn-navy{background:var(--navy-800);border-color:var(--navy-800);color:#fff;}
.btn-navy:hover{background:var(--navy-900);}
.btn-ghost{border-color:transparent;background:transparent;}
.btn-ghost:hover{background:var(--navy-100);}
.btn-danger{color:var(--danger);}
.btn-danger:hover{background:var(--danger-bg);border-color:var(--danger);}
.btn-sm{padding:6px 10px;font-size:12px;}
.btn-icon{padding:7px;width:32px;height:32px;justify-content:center;}

/* CARDS / GRID */
.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1000px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;}
.stat-card{position:relative;overflow:hidden;}
.stat-label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.4px;}
.stat-value{font-family:var(--font-display);font-size:26px;font-weight:700;margin-top:8px;color:var(--navy-900);}
.stat-value.orange{color:var(--orange-600);}
.stat-trend{display:flex;align-items:center;gap:4px;margin-top:8px;font-size:12px;color:var(--success);font-weight:600;}
.stat-trend.down{color:var(--danger);}
.stat-trend svg{width:13px;height:13px;}

.section-title{font-family:var(--font-display);font-size:16px;font-weight:600;margin:28px 0 12px;display:flex;align-items:center;justify-content:space-between;}
.section-title:first-child{margin-top:0;}

/* TABLE */
table{width:100%;border-collapse:collapse;font-size:13.5px;}
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
thead th{
  text-align:left;padding:11px 16px;background:var(--navy-100);
  color:var(--navy-800);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:0.4px;
  border-bottom:1px solid var(--border);
}
tbody td{padding:11px 16px;border-bottom:1px solid var(--border);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#fafbfd;}
.num{font-family:var(--font-mono);}
.amt-pos{color:var(--success);font-weight:600;}
.amt-neg{color:var(--danger);font-weight:600;}
.empty-row td{text-align:center;padding:40px 16px;color:var(--muted);}
.row-actions{display:flex;gap:6px;justify-content:flex-end;}

/* BADGE */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.badge-success{background:var(--success-bg);color:var(--success);}
.badge-orange{background:var(--orange-100);color:var(--orange-600);}
.badge-navy{background:var(--navy-100);color:var(--navy-800);}
.badge-muted{background:#eef0f4;color:var(--muted);}

/* FORMS */
label{display:block;font-size:12.5px;font-weight:600;color:var(--text);margin-bottom:5px;}
input,select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:7px;
  font-family:var(--font-body);font-size:13.5px;background:#fff;color:var(--text);
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy-700);box-shadow:0 0 0 3px var(--navy-100);}
.form-row{margin-bottom:14px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
textarea{resize:vertical;min-height:60px;}

/* MODAL */
#modal-root{position:fixed;inset:0;z-index:100;display:none;}
#modal-root.open{display:block;}
.modal-backdrop{position:absolute;inset:0;background:rgba(8,20,40,0.5);}
.modal-box{
  position:relative;max-width:520px;width:92%;margin:6vh auto 0;background:#fff;
  border-radius:14px;max-height:88vh;overflow-y:auto;
  box-shadow:0 20px 60px rgba(8,20,40,0.3);
}
.modal-box.wide{max-width:680px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;border-radius:14px 14px 0 0;}
.modal-head h2{font-family:var(--font-display);font-size:17px;font-weight:600;}
.modal-body{padding:20px 22px;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:16px 22px;border-top:1px solid var(--border);}

/* CLIENT CARDS */
.client-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;}
.client-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;cursor:pointer;}
.client-title{display:flex;align-items:center;gap:12px;}
.client-avatar{width:38px;height:38px;border-radius:9px;background:var(--navy-800);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:15px;}
.client-name{font-weight:600;font-size:14.5px;}
.client-meta{font-size:12px;color:var(--muted);margin-top:2px;}
.client-body{padding:0 20px 18px;display:none;border-top:1px solid var(--border);}
.client-body.open{display:block;padding-top:14px;}
.project-chip{
  display:inline-flex;align-items:center;gap:8px;background:var(--navy-100);color:var(--navy-800);
  padding:7px 12px;border-radius:8px;font-size:12.5px;font-weight:600;margin:0 8px 8px 0;
}
.project-chip .del{cursor:pointer;color:var(--muted);}
.project-chip .del:hover{color:var(--danger);}
.chevron{transition:transform .15s;}
.chevron.rot{transform:rotate(180deg);}

/* FILTER BAR */
.filter-bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:flex-end;}
.filter-bar .form-row{margin-bottom:0;min-width:150px;}

/* EMPTY STATE */
.empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-state svg{width:44px;height:44px;color:var(--border);margin-bottom:12px;}
.empty-state p{font-size:13.5px;margin-bottom:14px;}

/* TOAST */
#toast-root{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--navy-900);color:#fff;padding:11px 18px;border-radius:8px;font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,0.2);animation:slideIn .2s ease;}
.toast.error{background:var(--danger);}
.toast.success{background:var(--success);}
@keyframes slideIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* CHART */
.chart-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;}
.legend{display:flex;gap:18px;margin-bottom:14px;font-size:12.5px;}
.legend-item{display:flex;align-items:center;gap:6px;}
.legend-dot{width:9px;height:9px;border-radius:3px;}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;}
.tab{padding:9px 16px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;}
.tab.active{color:var(--navy-800);border-color:var(--orange-500);}

.hint{font-size:11.5px;color:var(--muted);margin-top:4px;}
.divider{height:1px;background:var(--border);margin:18px 0;}
.inline-flex{display:flex;align-items:center;gap:8px;}
.text-right{text-align:right;}
.w-full{width:100%;}
.mt-8{margin-top:8px;}
.link-btn{background:none;border:none;color:var(--navy-700);font-weight:600;cursor:pointer;font-size:12.5px;padding:0;}
.link-btn:hover{text-decoration:underline;}

@media(max-width:860px){
  #sidebar{position:fixed;transform:translateX(-100%);transition:transform .2s;z-index:50;}
  #sidebar.open{transform:translateX(0);}
  .grid-4,.grid-3,.grid-2{grid-template-columns:1fr 1fr;}
  #content{padding:18px 14px 50px;}
  #topbar{padding:14px 16px;}
}
</style>
</head>

/* ============ STATE / API-BACKED DATABASE ============ */
let state = null;

function uid(){ return 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function defaultSettings(){
  return {
    companyName:'Crestovia',
    tagline:'Digital Marketing Agency',
    ownerName:'',
    email:'',
    phone:'',
    address:'Pune, Maharashtra',
    gstin:'',
    bankDetails:'',
    invoicePrefix:'CRV',
    nextInvoiceNo:1,
    taxRate:18,
    auth:{ username:'admin', passwordHash:'' }
  };
}

async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function normalizeState(){
  state.settings = Object.assign(defaultSettings(), state.settings||{});
  state.clients = state.clients||[];
  state.projects = state.projects||[];
  state.expenses = state.expenses||[];
  state.payments = state.payments||[];
  state.invoices = state.invoices||[];
  state.dailyLog = state.dailyLog||[];
}

// Loads data from the real database via the API. Returns 'ok', 'unauthed', or 'error'.
async function loadState(){
  try{
    const res = await fetch('/api/data', { credentials:'same-origin' });
    if(res.status === 401) return 'unauthed';
    if(!res.ok) return 'error';
    const json = await res.json();
    state = json.data;
    normalizeState();
    return 'ok';
  }catch(e){ return 'error'; }
}

async function saveState(){
  try{
    const res = await fetch('/api/data', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      credentials:'same-origin',
      body: JSON.stringify(state)
    });
    if(res.status === 401){ isAuthenticated = false; renderLogin(); return; }
    if(!res.ok){ toast('Could not save changes to the database', 'error'); }
  }catch(e){ toast('Could not save changes to the database', 'error'); }
}

/* ============ HELPERS ============ */
function fmtMoney(n, forPdf){
  n = Number(n)||0;
  const s = Math.round(n).toLocaleString('en-IN');
  return forPdf ? ('Rs. ' + s) : ('\u20B9' + s);
}
function fmtDate(d){
  if(!d) return '-';
  const dt = new Date(d);
  return dt.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function monthLabel(d){ return new Date(d).toLocaleDateString('en-IN',{month:'short',year:'2-digit'}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function clientName(id){ const c = state.clients.find(x=>x.id===id); return c ? c.name : 'Removed client'; }
function projectName(id){ if(!id) return '-'; const p = state.projects.find(x=>x.id===id); return p ? p.name : 'Removed project'; }
function projectsForClient(cid){ return state.projects.filter(p=>p.clientId===cid); }

function toast(msg, type){
  const root = document.getElementById('toast-root');
  const t = document.createElement('div');
  t.className = 'toast' + (type ? ' '+type : '');
  t.textContent = msg;
  root.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); }, 2600);
}

/* ============ DASHBOARD ============ */
function renderDashboard(){
  const totalRevenue = state.payments.reduce((s,p)=>s+Number(p.amount||0),0);
  const totalExpense = state.expenses.reduce((s,e)=>s+Number(e.amount||0),0);
  const net = totalRevenue - totalExpense;
  const activeClients = state.clients.length;
  const activeProjects = state.projects.length;

  const now = new Date();
  const thisMonthLog = state.dailyLog.filter(l=>{
    const d = new Date(l.date);
    return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
  });
  const leadsThisMonth = thisMonthLog.reduce((s,l)=>s+Number(l.leadsSent||0),0);
  const creativesThisMonth = thisMonthLog.reduce((s,l)=>s+Number(l.creativesSent||0),0);

  // last 6 months chart data
  const months = [];
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push(d);
  }
  const chartData = months.map(m=>{
    const rev = state.payments.filter(p=>{ const d=new Date(p.date); return d.getMonth()===m.getMonth() && d.getFullYear()===m.getFullYear(); }).reduce((s,p)=>s+Number(p.amount||0),0);
    const exp = state.expenses.filter(e=>{ const d=new Date(e.date); return d.getMonth()===m.getMonth() && d.getFullYear()===m.getFullYear(); }).reduce((s,e)=>s+Number(e.amount||0),0);
    return { label: monthLabel(m), rev, exp };
  });
  const maxVal = Math.max(1, ...chartData.map(c=>Math.max(c.rev,c.exp)));

  const recent = [
    ...state.payments.map(p=>({ type:'payment', date:p.date, text:`Payment received from ${clientName(p.clientId)}${p.projectId?' — '+projectName(p.projectId):''}`, amount:p.amount })),
    ...state.expenses.map(e=>({ type:'expense', date:e.date, text:`${e.category}: ${e.description||''}`, amount:-e.amount })),
    ...state.dailyLog.map(l=>({ type:'log', date:l.date, text:`Logged ${l.leadsSent||0} leads, ${l.creativesSent||0} creatives sent`, amount:null })),
  ].sort((a,b)=> new Date(b.date)-new Date(a.date)).slice(0,8);

  return `
    <div class="grid grid-4">
      <div class="card stat-card">
        <div class="stat-label">Total revenue</div>
        <div class="stat-value">${fmtMoney(totalRevenue)}</div>
        <div class="stat-trend">${I.arrowUp}All-time payments received</div>
      </div>
      <div class="card stat-card">
        <div class="stat-label">Total expenses</div>
        <div class="stat-value">${fmtMoney(totalExpense)}</div>
        <div class="stat-trend down">${I.arrowDown}All-time spending</div>
      </div>
      <div class="card stat-card">
        <div class="stat-label">Net position</div>
        <div class="stat-value ${net<0?'':'orange'}" style="color:${net<0?'var(--danger)':'var(--navy-900)'}">${fmtMoney(net)}</div>
        <div class="stat-trend" style="color:var(--muted)">Revenue minus expenses</div>
      </div>
      <div class="card stat-card">
        <div class="stat-label">Clients / Projects</div>
        <div class="stat-value">${activeClients} <span style="color:var(--muted);font-size:16px;">/ ${activeProjects}</span></div>
        <div class="stat-trend" style="color:var(--muted)">Active accounts</div>
      </div>
    </div>

    <div class="grid grid-2" style="margin-top:16px;">
      <div class="card stat-card">
        <div class="stat-label">Leads sent this month</div>
        <div class="stat-value orange">${leadsThisMonth}</div>
      </div>
      <div class="card stat-card">
        <div class="stat-label">Creatives sent this month</div>
        <div class="stat-value orange">${creativesThisMonth}</div>
      </div>
    </div>

    <div class="section-title">Revenue vs expenses — last 6 months</div>
    <div class="chart-wrap">
      <div class="legend">
        <div class="legend-item"><span class="legend-dot" style="background:var(--orange-500)"></span>Revenue</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--navy-800)"></span>Expenses</div>
      </div>
      <div style="display:flex;align-items:flex-end;gap:22px;height:180px;padding:0 6px;">
        ${chartData.map(c=>`
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;">
            <div style="display:flex;align-items:flex-end;gap:4px;height:150px;">
              <div title="Revenue ${fmtMoney(c.rev)}" style="width:16px;border-radius:4px 4px 0 0;background:var(--orange-500);height:${Math.max(3,(c.rev/maxVal)*150)}px;"></div>
              <div title="Expenses ${fmtMoney(c.exp)}" style="width:16px;border-radius:4px 4px 0 0;background:var(--navy-800);height:${Math.max(3,(c.exp/maxVal)*150)}px;"></div>
            </div>
            <div style="font-size:11px;color:var(--muted);">${c.label}</div>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="section-title">Recent activity</div>
    <div class="table-wrap">
      <table>
        <tbody>
          ${recent.length ? recent.map(r=>`
            <tr>
              <td style="width:90px;color:var(--muted);font-size:12.5px;">${fmtDate(r.date)}</td>

  return `

function exportToExcel(){
  const wb = XLSX.utils.book_new();

  const clientsData = state.clients.map(c=>({

  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(clientsData.length?clientsData:[{}]), 'Clients');

  const projectsData = state.projects.map(p=>({
    'Project ID': p.id, 'Client ID': p.clientId, 'Client Name': clientName(p.clientId), 'Project Name': p.name
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(projectsData.length?projectsData:[{}]), 'Projects');

  const expensesData = state.expenses.map(e=>({
    'Expense ID': e.id, 'Date': e.date, 'Category': e.category, 'Description': e.description||'',
    'Client ID': e.clientId||'', 'Client Name': e.clientId?clientName(e.clientId):'',
    'Project ID': e.projectId||'', 'Project Name': e.projectId?projectName(e.projectId):'',
    'Amount': Number(e.amount)||0
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(expensesData.length?expensesData:[{}]), 'Expenses');

  const paymentsData = state.payments.map(p=>({
    'Payment ID': p.id, 'Date': p.date, 'Client ID': p.clientId, 'Client Name': clientName(p.clientId),
    'Project ID': p.projectId||'', 'Project Name': p.projectId?projectName(p.projectId):'',
    'Mode': p.mode||'', 'Note': p.note||'', 'Amount': Number(p.amount)||0,
    'Invoice ID': p.invoiceId||''
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(paymentsData.length?paymentsData:[{}]), 'Payments');

  const invoicesData = state.invoices.map(inv=>({
    'Invoice ID': inv.id, 'Invoice Number': inv.number, 'Date': inv.date,
    'Client ID': inv.clientId, 'Client Name': clientName(inv.clientId),
    'Project ID': inv.projectId||'', 'Project Name': inv.projectId?projectName(inv.projectId):'',
    'Items': (inv.items||[]).map(it=>`${it.desc} (qty ${it.qty} x ${it.rate})`).join(' | '),
    'Subtotal': inv.subtotal, 'Tax Rate %': inv.taxRate, 'Tax': inv.tax, 'Total': inv.total
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(invoicesData.length?invoicesData:[{}]), 'Invoices');

  const logData = state.dailyLog.map(l=>({
    'Log ID': l.id, 'Date': l.date, 'Client ID': l.clientId||'', 'Client Name': l.clientId?clientName(l.clientId):'',
    'Leads Sent': Number(l.leadsSent)||0, 'Creatives Sent': Number(l.creativesSent)||0, 'Notes': l.notes||''
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(logData.length?logData:[{}]), 'Daily Log');

  XLSX.writeFile(wb, `crestovia-data-${todayStr()}.xlsx`);
}

function importFromExcel(file){
  const reader = new FileReader();
  reader.onload = async ev=>{
    try{
      const data = new Uint8Array(ev.target.result);
      const wb = XLSX.read(data, { type:'array' });
      const sheet = name => wb.Sheets[name] ? XLSX.utils.sheet_to_json(wb.Sheets[name], { defval:'' }) : [];

      const clientRows = sheet('Clients').filter(r=>r['Name']);
      const newClients = clientRows.map(r=>({
        id: String(r['Client ID']||'').trim() || uid(),
        name: String(r['Name']||'').trim(), contactPerson: r['Contact Person']||'', email: r['Email']||'', phone: r['Phone']||'',
        createdAt: Date.now()
      }));
      const clientIdByName = {};
      newClients.forEach(c=>{ clientIdByName[c.name.toLowerCase()] = c.id; });
      const resolveClient = (id, name) => {
        if(id && newClients.some(c=>c.id===String(id).trim())) return String(id).trim();
        if(name && clientIdByName[String(name).trim().toLowerCase()]) return clientIdByName[String(name).trim().toLowerCase()];
        return null;
      };

      const projectRows = sheet('Projects').filter(r=>r['Project Name']);
      const newProjects = projectRows.map(r=>({
        id: String(r['Project ID']||'').trim() || uid(),
        clientId: resolveClient(r['Client ID'], r['Client Name']),
        name: String(r['Project Name']||'').trim(), createdAt: Date.now()
      })).filter(p=>p.clientId);
      const projectIdByNameClient = {};
      newProjects.forEach(p=>{ projectIdByNameClient[p.clientId+'|'+p.name.toLowerCase()] = p.id; });
      const resolveProject = (id, name, clientId) => {
        if(id && newProjects.some(p=>p.id===String(id).trim())) return String(id).trim();
        if(name && clientId && projectIdByNameClient[clientId+'|'+String(name).trim().toLowerCase()]) return projectIdByNameClient[clientId+'|'+String(name).trim().toLowerCase()];
        return null;
      };

      const newExpenses = sheet('Expenses').filter(r=>r['Category']||r['Amount']).map(r=>{
        const clientId = resolveClient(r['Client ID'], r['Client Name']);
        return {
          id: String(r['Expense ID']||'').trim() || uid(), date: r['Date']||todayStr(), category: r['Category']||'Miscellaneous',
          description: r['Description']||'', clientId, projectId: resolveProject(r['Project ID'], r['Project Name'], clientId),
          amount: Number(r['Amount'])||0
        };
      });

      const newPayments = sheet('Payments').filter(r=>r['Amount']).map(r=>{
        const clientId = resolveClient(r['Client ID'], r['Client Name']);
        return {
          id: String(r['Payment ID']||'').trim() || uid(), date: r['Date']||todayStr(), clientId,
          projectId: resolveProject(r['Project ID'], r['Project Name'], clientId),
          mode: r['Mode']||'Other', note: r['Note']||'', amount: Number(r['Amount'])||0,
          invoiceId: String(r['Invoice ID']||'').trim() || null
        };
      }).filter(p=>p.clientId);

      const newInvoices = sheet('Invoices').filter(r=>r['Invoice Number']).map(r=>{
        const clientId = resolveClient(r['Client ID'], r['Client Name']);
        return {
          id: String(r['Invoice ID']||'').trim() || uid(), number: r['Invoice Number'], date: r['Date']||todayStr(),
          clientId, projectId: resolveProject(r['Project ID'], r['Project Name'], clientId),
          items: String(r['Items']||'').split('|').map(s=>s.trim()).filter(Boolean).map(s=>({desc:s, qty:1, rate:0})),
          subtotal: Number(r['Subtotal'])||0, taxRate: Number(r['Tax Rate %'])||0, tax: Number(r['Tax'])||0, total: Number(r['Total'])||0
        };
      }).filter(inv=>inv.clientId);

      const newLog = sheet('Daily Log').filter(r=>r['Date']).map(r=>({
        id: String(r['Log ID']||'').trim() || uid(), date: r['Date'], clientId: resolveClient(r['Client ID'], r['Client Name']),
        leadsSent: Number(r['Leads Sent'])||0, creativesSent: Number(r['Creatives Sent'])||0, notes: r['Notes']||''
      }));

      state.clients = newClients;
      state.projects = newProjects;
      state.expenses = newExpenses;
      state.payments = newPayments;
      state.invoices = newInvoices;
      state.dailyLog = newLog;
      const maxInvNo = newInvoices.reduce((m,inv)=>{
        const match = String(inv.number||'').match(/(\d+)$/);
        return match ? Math.max(m, Number(match[1])+1) : m;
      }, state.settings.nextInvoiceNo);
      state.settings.nextInvoiceNo = maxInvNo;

      await saveState();
      render();
      toast('Excel workbook imported', 'success');
    }catch(err){
      toast('Could not read that Excel file', 'error');
    }
  };
  reader.readAsArrayBuffer(file);
}

function renderInvoiceItems(){

  if(!wrap) return;
  wrap.innerHTML = invoiceDraftItems.map((it,i)=>`
    <div class="inline-flex" style="margin-bottom:8px;align-items:flex-start;">
      <input placeholder="Description" data-idx="${i}" data-field="desc" value="${esc(it.desc)}" style="flex:2;">

    </div>
  `).join('');
  wrap.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const idx = +e.target.dataset.idx, field = e.target.dataset.field;
      invoiceDraftItems[idx][field] = field==='desc' ? e.target.value : Number(e.target.value)||0;
      updateInvoiceTotals();
    });
  });
  updateInvoiceTotals();
}

function updateInvoiceTotals(){
  const totalsEl = document.getElementById('invoice-totals');
  if(!totalsEl) return;
  const form = document.getElementById('invoice-form');
  const taxRate = form ? Number(form.querySelector('[name="taxRate"]').value)||0 : 0;
  const subtotal = invoiceDraftItems.reduce((s,it)=>s+(Number(it.qty)||0)*(Number(it.rate)||0),0);
  const tax = subtotal * taxRate/100;
  const total = subtotal + tax;
  totalsEl.innerHTML = `
    <div>Subtotal: <strong>${fmtMoney(subtotal)}</strong></div>
    <div>GST (${taxRate}%): <strong>${fmtMoney(tax)}</strong></div>
    <div style="font-size:16px;margin-top:4px;">Total: <strong style="color:var(--orange-600);">${fmtMoney(total)}</strong></div>
  `;
}

/* ============ PDF GENERATION ============ */
function buildInvoicePDF(invoice){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const s = state.settings;
  const client = state.clients.find(c=>c.id===invoice.clientId);
  const project = state.projects.find(p=>p.id===invoice.projectId);

  try{ doc.addImage(LOGO_B64, 'PNG', 40, 34, 46, 46); }catch(e){}
  doc.setFont('helvetica','bold'); doc.setFontSize(17); doc.setTextColor(8,29,59);
  doc.text(s.companyName||'Crestovia', 96, 52);
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(104,116,140);
  let hy = 66;
  if(s.tagline){ doc.text(s.tagline, 96, hy); hy+=13; }
  if(s.address){ doc.text(String(s.address).replace(/\n/g,', '), 96, hy, {maxWidth:220}); hy+=13; }
  const contactLine = [s.email, s.phone].filter(Boolean).join('  |  ');
  if(contactLine){ doc.text(contactLine, 96, hy); }

  doc.setFont('helvetica','bold'); doc.setFontSize(24); doc.setTextColor(245,114,10);
  doc.text('INVOICE', 555, 50, { align:'right' });
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(30,35,56);
  doc.text('Invoice #: ' + invoice.number, 555, 70, { align:'right' });
  doc.text('Date: ' + fmtDate(invoice.date), 555, 84, { align:'right' });
  if(s.gstin){ doc.text('GSTIN: ' + s.gstin, 555, 98, { align:'right' }); }

  doc.setDrawColor(227,232,240); doc.line(40, 118, 555, 118);

  doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(8,29,59);
  doc.text('BILL TO', 40, 138);
  doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(30,35,56);
  doc.text(client ? client.name : 'Client', 40, 154);
  doc.setFontSize(9.5); doc.setTextColor(104,116,140);
  let by = 168;
  if(project){ doc.text('Project: ' + project.name, 40, by); by += 13; }
  if(client && client.email){ doc.text(client.email, 40, by); by += 13; }
  if(client && client.phone){ doc.text(client.phone, 40, by); by += 13; }

  doc.autoTable({
    startY: Math.max(190, by+10),
    head: [['Description','Qty','Rate','Amount']],
    body: invoice.items.map(it=>[it.desc||'-', String(it.qty), fmtMoney(it.rate,true), fmtMoney(it.qty*it.rate,true)]),
    theme: 'plain',
    headStyles: { fillColor:[8,29,59], textColor:255, fontStyle:'bold', fontSize:9.5 },
    styles: { fontSize:10, cellPadding:8, textColor:[30,35,56] },
    columnStyles: { 1:{halign:'right',cellWidth:45}, 2:{halign:'right',cellWidth:85}, 3:{halign:'right',cellWidth:90} },
    margin: { left:40, right:40 }
  });

  let finalY = doc.lastAutoTable.finalY + 22;
  doc.setFontSize(10); doc.setTextColor(30,35,56);
  doc.text('Subtotal: ' + fmtMoney(invoice.subtotal,true), 555, finalY, { align:'right' });
  if(invoice.tax>0){ finalY += 15; doc.text(`GST (${invoice.taxRate}%): ` + fmtMoney(invoice.tax,true), 555, finalY, { align:'right' }); }
  finalY += 20;
  doc.setDrawColor(227,232,240); doc.line(400, finalY-14, 555, finalY-14);
  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(245,114,10);
  doc.text('Total: ' + fmtMoney(invoice.total,true), 555, finalY, { align:'right' });

  let fy = finalY + 40;
  if(s.bankDetails){
    doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(8,29,59);
    doc.text('PAYMENT DETAILS', 40, fy); fy += 14;
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(104,116,140);
    String(s.bankDetails).split('\n').forEach(line=>{ doc.text(line, 40, fy); fy += 12; });
  }

  doc.setFontSize(8.5); doc.setTextColor(150,158,175);
  doc.text('Thank you for your business.', 40, 800);

  return doc;
}

/* ============ EVENT HANDLING ============ */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;
  const id = t.dataset.id;
  handleAction(action, id, t);
});

document.addEventListener('change', e=>{
  const role = e.target.dataset.role;
  if(role==='exp-client'){
    const sel = document.querySelector('[data-role="exp-project"]');
    if(sel) sel.innerHTML = projectOptions(e.target.value);
  }
  if(role==='pay-client'){
    const sel = document.querySelector('[data-role="pay-project"]');
    if(sel) sel.innerHTML = projectOptions(e.target.value);
  }
  if(role==='inv-client'){
    const sel = document.querySelector('[data-role="inv-project"]');
    if(sel) sel.innerHTML = projectOptions(e.target.value);
  }
  if(e.target.closest('#invoice-form') && e.target.name==='taxRate'){
    updateInvoiceTotals();
  }
  if(e.target.dataset.action==='filter-expense-client'){ state._expFilterClient = e.target.value; render(); }
  if(e.target.dataset.action==='filter-expense-category'){ state._expFilterCategory = e.target.value; render(); }
  if(e.target.id==='restore-excel-input'){
    const file = e.target.files[0];
    if(!file) return;
    if(!confirm('Import this Excel workbook? This will replace all current data with what is in the file.')) { e.target.value=''; return; }
    importFromExcel(file);
    e.target.value = '';
  }
  if(e.target.id==='restore-file-input'){
    const file = e.target.files[0];
    if(!file) return;
    if(!confirm('Restore from this backup? This will replace all current data.')) { e.target.value=''; return; }
    const reader = new FileReader();
    reader.onload = async ev=>{
      try{
        const data = JSON.parse(ev.target.result);
        const currentAuth = state.settings.auth;
        state = data;
        state.settings = Object.assign(defaultSettings(), state.settings||{});
        if(!state.settings.auth || !state.settings.auth.passwordHash) state.settings.auth = currentAuth;
        state.clients = state.clients||[]; state.projects = state.projects||[];
        state.expenses = state.expenses||[]; state.payments = state.payments||[];
        state.invoices = state.invoices||[]; state.dailyLog = state.dailyLog||[];
        await saveState();
        render();
        toast('Backup restored', 'success');
      }catch(err){ toast('Could not read that backup file', 'error'); }
      e.target.value = '';
    };
    reader.readAsText(file);
  }
});

document.addEventListener('submit', async e=>{
  e.preventDefault();
  const form = e.target;
  if(form.id==='client-form') return submitClientForm(form);
  if(form.id==='project-form') return submitProjectForm(form);
  if(form.id==='expense-form') return submitExpenseForm(form);
  if(form.id==='payment-form') return submitPaymentForm(form);
  if(form.id==='log-form') return submitLogForm(form);
  if(form.id==='invoice-form') return submitInvoiceForm(form);
  if(form.id==='settings-form') return submitSettingsForm(form);
  if(form.id==='login-form') return submitLoginForm(form);
  if(form.id==='auth-form') return submitAuthForm(form);
});

async function handleAction(action, id, el){
  if(action==='logout'){
    fetch('/api/logout', { method:'POST' }).catch(()=>{}).finally(()=>{ isAuthenticated = false; state = { settings: { companyName: (state&&state.settings&&state.settings.companyName)||'Crestovia' } }; renderLogin(); });
    return;
  }
  if(action==='nav'){ location.hash = '#' + el.dataset.route; return; }
  if(action==='close-modal'){ closeModal(); return; }
  if(action==='open-add-client'){ modalAddClient(); return; }
  if(action==='edit-client'){ modalAddClient(state.clients.find(c=>c.id===id)); return; }
  if(action==='delete-client'){
    if(!confirm('Remove this client? Their projects will also be removed. Expense and payment history will be kept but shown as unlinked.')) return;
    const projIds = state.projects.filter(p=>p.clientId===id).map(p=>p.id);
    state.projects = state.projects.filter(p=>p.clientId!==id);
    state.clients = state.clients.filter(c=>c.id!==id);
    await saveState(); render(); toast('Client removed');
    return;
  }
  if(action==='toggle-client'){
    const body = document.getElementById('body-'+id);
    const chev = document.getElementById('chev-'+id);
    if(body){ body.classList.toggle('open'); chev.classList.toggle('rot'); }
    return;
  }
  if(action==='open-add-project'){ modalAddProject(id); return; }
  if(action==='delete-project'){
    if(!confirm('Remove this project?')) return;
    state.projects = state.projects.filter(p=>p.id!==id);
    await saveState(); render(); toast('Project removed');
    return;
  }
  if(action==='open-add-expense'){ modalAddExpense(); return; }
  if(action==='delete-expense'){
    if(!confirm('Delete this expense?')) return;
    state.expenses = state.expenses.filter(x=>x.id!==id);
    await saveState(); render(); toast('Expense deleted');
    return;
  }
  if(action==='open-add-payment'){ modalAddPayment(); return; }
  if(action==='delete-payment'){
    if(!confirm('Delete this payment record?')) return;
    state.payments = state.payments.filter(x=>x.id!==id);
    await saveState(); render(); toast('Payment deleted');
    return;
  }
  if(action==='open-add-log'){ modalAddLog(); return; }
  if(action==='delete-log'){
    state.dailyLog = state.dailyLog.filter(x=>x.id!==id);
    await saveState(); render(); toast('Entry deleted');
    return;
  }
  if(action==='open-add-invoice'){ modalAddInvoice(); return; }
  if(action==='add-invoice-item'){ invoiceDraftItems.push({desc:'',qty:1,rate:0}); renderInvoiceItems(); return; }
  if(action==='remove-invoice-item'){
    invoiceDraftItems.splice(+el.dataset.idx,1);
    if(!invoiceDraftItems.length) invoiceDraftItems.push({desc:'',qty:1,rate:0});
    renderInvoiceItems();
    return;
  }
  if(action==='invoice-from-payment'){
    const p = state.payments.find(x=>x.id===id);
    if(!p) return;
    modalAddInvoice({
      clientId: p.clientId,
      projectId: p.projectId,
      paymentId: p.id,
      amount: p.amount,
      desc: `Digital marketing services${p.projectId?' — '+projectName(p.projectId):''}`
    });
    return;
  }
  if(action==='download-invoice'){
    const inv = state.invoices.find(x=>x.id===id);
    if(!inv) return;
    const doc = buildInvoicePDF(inv);
    doc.save(`Invoice-${inv.number}.pdf`);
    return;
  }
  if(action==='delete-invoice'){
    if(!confirm('Delete this invoice record? The PDF you already downloaded will not be affected.')) return;
    state.invoices = state.invoices.filter(x=>x.id!==id);
    state.payments.forEach(p=>{ if(p.invoiceId===id) p.invoiceId=null; });
    await saveState(); render(); toast('Invoice deleted');
    return;
  }
  if(action==='export-excel'){ exportToExcel(); toast('Excel workbook downloaded'); return; }
  if(action==='trigger-restore-excel'){ document.getElementById('restore-excel-input').click(); return; }
  if(action==='trigger-restore'){
    document.getElementById('restore-file-input').click();
    return;
  }
  if(action==='export-backup'){
    const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `crestovia-backup-${todayStr()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toast('Backup downloaded');
    return;
  }
}

async function submitClientForm(form){
  const fd = new FormData(form);
  const id = form.dataset.id;
  if(id){
    const c = state.clients.find(x=>x.id===id);
    Object.assign(c, { name: fd.get('name'), contactPerson: fd.get('contactPerson'), email: fd.get('email'), phone: fd.get('phone') });
  } else {
    state.clients.push({ id: uid(), name: fd.get('name'), contactPerson: fd.get('contactPerson'), email: fd.get('email'), phone: fd.get('phone'), createdAt: Date.now() });
  }
  await saveState(); closeModal(); render(); toast(id?'Client updated':'Client added');
}

async function submitProjectForm(form){
  const fd = new FormData(form);
  const clientId = form.dataset.clientId;
  state.projects.push({ id: uid(), clientId, name: fd.get('name'), createdAt: Date.now() });
  await saveState(); closeModal(); render();
  setTimeout(()=>{
    const body = document.getElementById('body-'+clientId);
    const chev = document.getElementById('chev-'+clientId);
    if(body){ body.classList.add('open'); chev.classList.add('rot'); }
  },30);
  toast('Project added');
}

async function submitExpenseForm(form){
  const fd = new FormData(form);
  state.expenses.push({
    id: uid(), date: fd.get('date'), category: fd.get('category'), description: fd.get('description'),
    clientId: fd.get('clientId')||null, projectId: fd.get('projectId')||null, amount: Number(fd.get('amount'))||0
  });
  await saveState(); closeModal(); render(); toast('Expense added');
}

async function submitPaymentForm(form){
  const fd = new FormData(form);
  state.payments.push({
    id: uid(), date: fd.get('date'), clientId: fd.get('clientId'), projectId: fd.get('projectId')||null,
    amount: Number(fd.get('amount'))||0, mode: fd.get('mode'), note: fd.get('note'), invoiceId: null
  });
  await saveState(); closeModal(); render(); toast('Payment recorded');
}

async function submitLogForm(form){
  const fd = new FormData(form);
  state.dailyLog.push({
    id: uid(), date: fd.get('date'), clientId: fd.get('clientId')||null,
    leadsSent: Number(fd.get('leadsSent'))||0, creativesSent: Number(fd.get('creativesSent'))||0, notes: fd.get('notes')
  });
  await saveState(); closeModal(); render(); toast('Log entry added');
}

async function submitInvoiceForm(form){
  const fd = new FormData(form);
  const items = invoiceDraftItems.filter(it=>it.desc || it.rate).map(it=>({ desc: it.desc, qty: Number(it.qty)||1, rate: Number(it.rate)||0 }));
  if(!items.length){ toast('Add at least one line item', 'error'); return; }
  const taxRate = Number(fd.get('taxRate'))||0;
  const subtotal = items.reduce((s,it)=>s+it.qty*it.rate,0);
  const tax = subtotal*taxRate/100;
  const total = subtotal+tax;
  const number = `${state.settings.invoicePrefix}-${String(state.settings.nextInvoiceNo).padStart(4,'0')}`;
  const invoice = {
    id: uid(), number, date: fd.get('date'), clientId: fd.get('clientId'), projectId: fd.get('projectId')||null,
    items, subtotal, taxRate, tax, total
  };
  state.invoices.push(invoice);
  state.settings.nextInvoiceNo += 1;
  const paymentId = form.dataset.paymentId;
  if(paymentId){
    const p = state.payments.find(x=>x.id===paymentId);
    if(p) p.invoiceId = invoice.id;
  }
  await saveState();
  const doc = buildInvoicePDF(invoice);
  doc.save(`Invoice-${invoice.number}.pdf`);
  closeModal(); render(); toast('Invoice generated and downloaded', 'success');
}

async function submitLoginForm(form){
  const fd = new FormData(form);
  const username = (fd.get('username')||'').trim();
  const password = fd.get('password')||'';
  const submitBtn = form.querySelector('button[type="submit"]');
  if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = 'Logging in...'; }
  try{
    const res = await fetch('/api/login', {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ username, password })
    });
    const json = await res.json().catch(()=>({}));
    if(res.ok && json.ok){
      const status = await loadState();
      if(status === 'ok'){ isAuthenticated = true; showApp(); return; }
      showLoginError('Logged in, but could not load your data. Please try again.');
    } else {
      showLoginError(json.error || 'Incorrect user ID or password.');
    }
  }catch(e){
    showLoginError('Could not reach the server. Check your connection and try again.');
  }
  if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = 'Log in'; }
}

function showLoginError(msg){
  const err = document.getElementById('login-error');
  if(err){ err.textContent = msg; err.style.display = 'block'; }
}

async function submitAuthForm(form){
  const fd = new FormData(form);
  const username = (fd.get('username')||'').trim();
  const newPass = fd.get('newPassword')||'';
  const confirmPass = fd.get('confirmPassword')||'';
  if(!username){ toast('User ID cannot be empty', 'error'); return; }
  if(newPass || confirmPass){
    if(newPass !== confirmPass){ toast('New passwords do not match', 'error'); return; }
    if(newPass.length < 6){ toast('Password should be at least 6 characters', 'error'); return; }
    state.settings.auth.passwordHash = await sha256(newPass);
  }
  state.settings.auth.username = username;
  await saveState();
  render();
  toast('Admin account updated', 'success');
}

async function submitSettingsForm(form){
  const fd = new FormData(form);
  Object.assign(state.settings, {
    companyName: fd.get('companyName'), tagline: fd.get('tagline'), ownerName: fd.get('ownerName'),
    email: fd.get('email'), phone: fd.get('phone'), address: fd.get('address'), gstin: fd.get('gstin'),
    bankDetails: fd.get('bankDetails'), invoicePrefix: fd.get('invoicePrefix'), taxRate: Number(fd.get('taxRate'))||0
  });
  await saveState(); render(); toast('Settings saved', 'success');
}

/* ============ INIT ============ */
(async function init(){
  const status = await loadState();
  if(status === 'ok'){
    isAuthenticated = true;
    showApp();
  } else {
    state = { settings: { companyName:'Crestovia' } };
    renderLogin();
    if(status === 'error'){ showLoginError('Could not reach the database. Check your connection.'); }
  }
})();
</script>
